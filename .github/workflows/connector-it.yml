# Connector 集成测试（开源库触发入口）
#
# 触发时机：push 任意分支（含 PR 合并后的推送）+ PR 提交/更新 + 手工触发。
# paths 过滤保证仅连接器相关路径变更时启动，文档/README 等改动不触发。
# 实际测试逻辑在 tapdata-it 的 connector-it-reusable.yml 中统一维护。
# 运行环境：office-build 自托管 runner（runs-on 在 reusable workflow 中配置）。
name: Connector Integration Tests

on:
  push:
    branches: ['**']
    paths:
      - 'connectors/**'
      - 'connectors-common/**'
      - 'connectors-javascript/**'
      - 'pom.xml'
      - '.github/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'connectors/**'
      - 'connectors-common/**'
      - 'connectors-javascript/**'
      - 'pom.xml'
      - '.github/**'
  workflow_dispatch:
    inputs:
      connectors:
        description: '手工指定模块列表（逗号分隔，如 connectors/mysql-connector, connectors/mongodb-connector）'
        required: false
        type: string

concurrency:
  group: connector-it-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connector-it:
    # tapdata-it#22: pin the DBForge configuration fix until it is released to main.
    uses: jarad0628/tapdata-it/.github/workflows/connector-it-reusable.yml@5d603ac4ac7e2c091339ed77d33eddb10bf1ef47
    with:
      connectors_override: ${{ inputs.connectors || '' }}
      dbforge_url: ${{ vars.CONNECTOR_IT_DBFORGE_URL }}
      dbforge_connectors: >-
        connectors/mysql-connector,
        connectors/postgres-connector,
        connectors/mariadb-connector,
        connectors/mysql-pxc-connector,
        connectors/aliyun-rds-mysql-connector,
        connectors/aws-rds-mysql-connector,
        connectors/polar-db-mysql-connector,
        connectors/aliyun-rds-mariadb-connector,
        connectors/tencent-db-mariadb-connector,
        connectors/aliyun-adb-postgres-connector,
        connectors/aliyun-rds-postgres-connector,
        connectors/tencent-db-postgres-connector,
        connectors/polar-db-postgres-connector
      # Kafka is outside this validation scope until broker/Registry are configured.
      excluded_connectors: >-
        connectors/kafka-connector,
        connectors/kafka-enhanced-connector,
        connectors/kafka-avro-connector
    secrets:
      MAVEN_SETTINGS: ${{ secrets.MAVEN_SETTINGS }}
      CONNECTOR_IT_DBFORGE_TOKEN: ${{ secrets.CONNECTOR_IT_DBFORGE_TOKEN }}
