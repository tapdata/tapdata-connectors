name: Publish one connector batch

on:
  workflow_call:
    inputs:
      batch:
        required: true
        type: number
      source_branch:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      scripts_sha:
        required: true
        type: string
      plan_id:
        required: true
        type: string
    secrets:
      NEXUS_INTERNAL_USERNAME:
        required: true
      NEXUS_INTERNAL_PASSWORD:
        required: true
      NEXUS_EXTERNAL_USERNAME:
        required: true
      NEXUS_EXTERNAL_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          SCRIPTS_SHA: ${{ inputs.scripts_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
        with:
          script: |
            const repository = 'tapdata/tapdata-connectors';
            const trustedRefs = new Set(['refs/heads/main', 'refs/heads/develop']);
            const workflowRef = process.env.CALLER_WORKFLOW.split('@').pop();
            if (context.repo.owner + '/' + context.repo.repo !== repository ||
                !trustedRefs.has(context.ref) ||
                !process.env.CALLER_WORKFLOW.startsWith(repository + '/.github/workflows/') ||
                !trustedRefs.has(workflowRef)) {
              throw new Error('Only workflows on trusted main or develop may publish.');
            }
            const { data: branch } = await github.rest.repos.getBranch({
              owner: 'tapdata', repo: 'tapdata-connectors',
              branch: workflowRef.replace(/^refs\/heads\//, ''),
            });
            if (branch.name !== workflowRef.replace(/^refs\/heads\//, '') || !branch.protected) {
              throw new Error('Publishing workflow branch must be protected.');
            }
            if (context.ref !== workflowRef) {
              const { data: caller } = await github.rest.repos.getBranch({
                owner: 'tapdata', repo: 'tapdata-connectors',
                branch: context.ref.replace(/^refs\/heads\//, ''),
              });
              if (caller.name !== context.ref.replace(/^refs\/heads\//, '') || !caller.protected) {
                throw new Error('Caller branch must be protected.');
              }
            }
            const sourceBranch = process.env.SOURCE_BRANCH;
            if (!sourceBranch || sourceBranch.startsWith('refs/')) throw new Error('Expected a source branch name.');
            const { data: source } = await github.rest.repos.getBranch({
              owner: 'tapdata', repo: 'tapdata-connectors', branch: sourceBranch,
            });
            if (source.name !== sourceBranch || !source.protected) throw new Error('Source branch must be protected.');
            for (const [sha, head] of [[process.env.SCRIPTS_SHA, branch.commit.sha],
                                       [process.env.SOURCE_SHA, source.commit.sha]]) {
              if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Expected a pinned commit SHA.');
              const { data } = await github.rest.repos.compareCommits({
                owner: 'tapdata', repo: 'tapdata-connectors', base: sha, head,
              });
              if (!['ahead', 'identical'].includes(data.status)) {
                throw new Error('Publishing commits must belong to the validated protected branch history.');
              }
            }

  prepare:
    needs: validate
    runs-on: ${{ vars.CONNECTOR_PUBLISH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      request_id: ${{ steps.request.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.scripts_sha }}
          path: scripts
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.plan_id }}
          merge-multiple: true
          path: release
      - name: Check immutable plan and select only missing JARs
        env:
          NEXUS_INTERNAL_URL: ${{ vars.NEXUS_INTERNAL_URL }}
          NEXUS_EXTERNAL_URL: ${{ vars.NEXUS_EXTERNAL_URL }}
          NEXUS_INTERNAL_CONNECT_IP: ${{ vars.NEXUS_INTERNAL_CONNECT_IP }}
          NEXUS_EXTERNAL_CONNECT_IP: ${{ vars.NEXUS_EXTERNAL_CONNECT_IP }}
          NEXUS_INTERNAL_USERNAME: ${{ secrets.NEXUS_INTERNAL_USERNAME }}
          NEXUS_INTERNAL_PASSWORD: ${{ secrets.NEXUS_INTERNAL_PASSWORD }}
          NEXUS_EXTERNAL_USERNAME: ${{ secrets.NEXUS_EXTERNAL_USERNAME }}
          NEXUS_EXTERNAL_PASSWORD: ${{ secrets.NEXUS_EXTERNAL_PASSWORD }}
          BATCH_INDEX: ${{ inputs.batch }}
        run: python3 -I scripts/connector-distribution/publish_connectors.py prepare --plan release/release_plan.json --batch "$BATCH_INDEX"
      - uses: actions/upload-artifact@v4
        id: request
        with:
          name: build-request-${{ inputs.batch }}
          path: build-request.json
          if-no-files-found: error
          overwrite: true

  build:
    needs: prepare
    # Source builds run on disposable GitHub-hosted VMs, never on a Nexus runner.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      artifacts_id: ${{ steps.jars.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tapdata/tapdata-connectors
          ref: ${{ inputs.scripts_sha }}
          path: scripts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tapdata/tapdata-connectors
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.request_id }}
          merge-multiple: true
          path: request
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build at most 10 missing connectors without Nexus credentials
        run: python3 -I scripts/connector-distribution/build_connectors.py request/build-request.json source build-output
      - uses: actions/upload-artifact@v4
        id: jars
        with:
          name: connector-jars-${{ inputs.batch }}
          path: build-output/
          if-no-files-found: error
          overwrite: true

  upload:
    needs: build
    runs-on: ${{ vars.CONNECTOR_PUBLISH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tapdata/tapdata-connectors
          ref: ${{ inputs.scripts_sha }}
          path: scripts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tapdata/tapdata-connectors
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      # Fetch the original plan directly from the plan job, never from build output.
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.plan_id }}
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifacts_id }}
          merge-multiple: true
          path: build-output
      - name: Recheck plan and upload this batch to both Nexus installations
        env:
          NEXUS_INTERNAL_URL: ${{ vars.NEXUS_INTERNAL_URL }}
          NEXUS_EXTERNAL_URL: ${{ vars.NEXUS_EXTERNAL_URL }}
          NEXUS_INTERNAL_CONNECT_IP: ${{ vars.NEXUS_INTERNAL_CONNECT_IP }}
          NEXUS_EXTERNAL_CONNECT_IP: ${{ vars.NEXUS_EXTERNAL_CONNECT_IP }}
          NEXUS_INTERNAL_USERNAME: ${{ secrets.NEXUS_INTERNAL_USERNAME }}
          NEXUS_INTERNAL_PASSWORD: ${{ secrets.NEXUS_INTERNAL_PASSWORD }}
          NEXUS_EXTERNAL_USERNAME: ${{ secrets.NEXUS_EXTERNAL_USERNAME }}
          NEXUS_EXTERNAL_PASSWORD: ${{ secrets.NEXUS_EXTERNAL_PASSWORD }}
          BATCH_INDEX: ${{ inputs.batch }}
        run: python3 -I scripts/connector-distribution/publish_connectors.py upload --source source --plan release/release_plan.json --batch "$BATCH_INDEX"
