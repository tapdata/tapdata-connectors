name: Publish connector artifacts

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Protected connector branch to publish (defaults to the selected workflow branch)
        required: false
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: Protected connector branch to publish.
        required: false
        type: string
    secrets:
      NEXUS_INTERNAL_USERNAME:
        required: true
      NEXUS_INTERNAL_PASSWORD:
        required: true
      NEXUS_EXTERNAL_USERNAME:
        required: true
      NEXUS_EXTERNAL_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: connector-publish
  cancel-in-progress: false

jobs:
  # Keep the release plan and JARs in one runner workspace; never pass them
  # through the GitHub Actions artifact service.
  publish:
    runs-on: ${{ vars.CONNECTOR_PUBLISH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 480
    steps:
      - name: Validate protected workflow and source branches
        id: source
        uses: actions/github-script@v7
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const repository = 'tapdata/tapdata-connectors';
            if (context.repo.owner + '/' + context.repo.repo !== repository ||
                !context.ref.startsWith('refs/heads/')) {
              throw new Error('Publishing must run from a repository branch.');
            }
            const getProtectedBranch = async (ref) => {
              const branch = ref.replace(/^refs\/heads\//, '');
              if (!branch || branch.startsWith('refs/')) {
                throw new Error('Only protected source branches may publish.');
              }
              const { data } = await github.rest.repos.getBranch({
                owner: 'tapdata', repo: 'tapdata-connectors', branch,
              });
              if (data.name !== branch || !data.protected) {
                throw new Error(`Branch ${branch} is not protected.`);
              }
              return data.commit.sha;
            };
            // Also validate the reusable workflow's own ref, not just its caller.
            const prefix = `${repository}/.github/workflows/`;
            if (!process.env.WORKFLOW_REF.startsWith(prefix)) {
              throw new Error('Unexpected publishing workflow repository or path.');
            }
            const workflowRef = process.env.WORKFLOW_REF.split('@').pop();
            const trustedRefs = new Set(['refs/heads/main', 'refs/heads/develop']);
            if (!trustedRefs.has(workflowRef) || !trustedRefs.has(context.ref)) {
              throw new Error('Publishing workflows and callers must run on trusted main or develop.');
            }
            const scriptsSha = await getProtectedBranch(workflowRef);
            core.setOutput('scripts_sha', scriptsSha);
            await getProtectedBranch(context.ref);
            const sha = await getProtectedBranch(process.env.SOURCE_REF);
            core.setOutput('sha', sha);
            core.setOutput('branch', process.env.SOURCE_REF.replace(/^refs\/heads\//, ''));

      - uses: actions/checkout@v4
        with:
          repository: tapdata/tapdata-connectors
          ref: ${{ steps.source.outputs.scripts_sha }}
          path: scripts
          persist-credentials: false
      - name: Validate Nexus configuration
        env:
          NEXUS_INTERNAL_URL: ${{ vars.NEXUS_INTERNAL_URL }}
          NEXUS_EXTERNAL_URL: ${{ vars.NEXUS_EXTERNAL_URL }}
          NEXUS_INTERNAL_CONNECT_IP: ${{ vars.NEXUS_INTERNAL_CONNECT_IP }}
          NEXUS_EXTERNAL_CONNECT_IP: ${{ vars.NEXUS_EXTERNAL_CONNECT_IP }}
          NEXUS_INTERNAL_USERNAME: ${{ secrets.NEXUS_INTERNAL_USERNAME }}
          NEXUS_INTERNAL_PASSWORD: ${{ secrets.NEXUS_INTERNAL_PASSWORD }}
          NEXUS_EXTERNAL_USERNAME: ${{ secrets.NEXUS_EXTERNAL_USERNAME }}
          NEXUS_EXTERNAL_PASSWORD: ${{ secrets.NEXUS_EXTERNAL_PASSWORD }}
        run: python3 -I scripts/connector-distribution/publish_connectors.py validate-config

      - uses: actions/checkout@v4
        with:
          repository: tapdata/tapdata-connectors
          ref: ${{ steps.source.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publisher recovery tests
        run: python3 -I -m unittest discover -s scripts/connector-distribution -p 'test_*.py'

      - name: Persist release plan in both Nexus installations
        id: plan
        env:
          NEXUS_INTERNAL_URL: ${{ vars.NEXUS_INTERNAL_URL }}
          NEXUS_EXTERNAL_URL: ${{ vars.NEXUS_EXTERNAL_URL }}
          NEXUS_INTERNAL_CONNECT_IP: ${{ vars.NEXUS_INTERNAL_CONNECT_IP }}
          NEXUS_EXTERNAL_CONNECT_IP: ${{ vars.NEXUS_EXTERNAL_CONNECT_IP }}
          NEXUS_INTERNAL_USERNAME: ${{ secrets.NEXUS_INTERNAL_USERNAME }}
          NEXUS_INTERNAL_PASSWORD: ${{ secrets.NEXUS_INTERNAL_PASSWORD }}
          NEXUS_EXTERNAL_USERNAME: ${{ secrets.NEXUS_EXTERNAL_USERNAME }}
          NEXUS_EXTERNAL_PASSWORD: ${{ secrets.NEXUS_EXTERNAL_PASSWORD }}
        run: python3 -I scripts/connector-distribution/publish_connectors.py plan --source source

      - name: Use the preinstalled JDK 17 on the configured self-hosted runner
        if: vars.CONNECTOR_PUBLISH_RUNNER != '' && steps.plan.outputs.batches != '[]'
        shell: bash
        run: |
          set -euo pipefail
          java_home=/usr/java/jdk-17.0.12
          [[ -x "$java_home/bin/java" ]] || {
            echo "::error::Expected preinstalled JDK 17 at $java_home" >&2
            exit 1
          }
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
          "$java_home/bin/java" -version

      - uses: actions/setup-java@v4
        if: vars.CONNECTOR_PUBLISH_RUNNER == '' && steps.plan.outputs.batches != '[]'
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare missing connector batches from Nexus plan
        if: steps.plan.outputs.batches != '[]'
        env:
          BATCHES: ${{ steps.plan.outputs.batches }}
          NEXUS_INTERNAL_URL: ${{ vars.NEXUS_INTERNAL_URL }}
          NEXUS_EXTERNAL_URL: ${{ vars.NEXUS_EXTERNAL_URL }}
          NEXUS_INTERNAL_CONNECT_IP: ${{ vars.NEXUS_INTERNAL_CONNECT_IP }}
          NEXUS_EXTERNAL_CONNECT_IP: ${{ vars.NEXUS_EXTERNAL_CONNECT_IP }}
          NEXUS_INTERNAL_USERNAME: ${{ secrets.NEXUS_INTERNAL_USERNAME }}
          NEXUS_INTERNAL_PASSWORD: ${{ secrets.NEXUS_INTERNAL_PASSWORD }}
          NEXUS_EXTERNAL_USERNAME: ${{ secrets.NEXUS_EXTERNAL_USERNAME }}
          NEXUS_EXTERNAL_PASSWORD: ${{ secrets.NEXUS_EXTERNAL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-requests build-output
          for batch in $(python3 -I -c 'import json, os; print(" ".join(map(str, json.loads(os.environ["BATCHES"]))))'); do
            python3 -I scripts/connector-distribution/publish_connectors.py prepare \
              --plan release_plan.json --batch "$batch" \
              --output "build-requests/batch-${batch}.json"
          done

      - name: Build missing connector batches locally without Nexus credentials
        if: steps.plan.outputs.batches != '[]'
        env:
          BATCHES: ${{ steps.plan.outputs.batches }}
        shell: bash
        run: |
          set -euo pipefail
          for batch in $(python3 -I -c 'import json, os; print(" ".join(map(str, json.loads(os.environ["BATCHES"]))))'); do
            python3 -I scripts/connector-distribution/build_connectors.py \
              "build-requests/batch-${batch}.json" source "build-output/batch-${batch}"
          done

      - name: Upload each local batch directly to both Nexus installations
        if: steps.plan.outputs.batches != '[]'
        env:
          BATCHES: ${{ steps.plan.outputs.batches }}
          NEXUS_INTERNAL_URL: ${{ vars.NEXUS_INTERNAL_URL }}
          NEXUS_EXTERNAL_URL: ${{ vars.NEXUS_EXTERNAL_URL }}
          NEXUS_INTERNAL_CONNECT_IP: ${{ vars.NEXUS_INTERNAL_CONNECT_IP }}
          NEXUS_EXTERNAL_CONNECT_IP: ${{ vars.NEXUS_EXTERNAL_CONNECT_IP }}
          NEXUS_INTERNAL_USERNAME: ${{ secrets.NEXUS_INTERNAL_USERNAME }}
          NEXUS_INTERNAL_PASSWORD: ${{ secrets.NEXUS_INTERNAL_PASSWORD }}
          NEXUS_EXTERNAL_USERNAME: ${{ secrets.NEXUS_EXTERNAL_USERNAME }}
          NEXUS_EXTERNAL_PASSWORD: ${{ secrets.NEXUS_EXTERNAL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for batch in $(python3 -I -c 'import json, os; print(" ".join(map(str, json.loads(os.environ["BATCHES"]))))'); do
            python3 -I scripts/connector-distribution/publish_connectors.py upload \
              --source source --plan release_plan.json --batch "$batch" \
              --artifacts "build-output/batch-${batch}"
          done

      - name: Verify complete inventory and publish BOM to both installations
        if: steps.plan.outputs.batches != '[]'
        env:
          NEXUS_INTERNAL_URL: ${{ vars.NEXUS_INTERNAL_URL }}
          NEXUS_EXTERNAL_URL: ${{ vars.NEXUS_EXTERNAL_URL }}
          NEXUS_INTERNAL_CONNECT_IP: ${{ vars.NEXUS_INTERNAL_CONNECT_IP }}
          NEXUS_EXTERNAL_CONNECT_IP: ${{ vars.NEXUS_EXTERNAL_CONNECT_IP }}
          NEXUS_INTERNAL_USERNAME: ${{ secrets.NEXUS_INTERNAL_USERNAME }}
          NEXUS_INTERNAL_PASSWORD: ${{ secrets.NEXUS_INTERNAL_PASSWORD }}
          NEXUS_EXTERNAL_USERNAME: ${{ secrets.NEXUS_EXTERNAL_USERNAME }}
          NEXUS_EXTERNAL_PASSWORD: ${{ secrets.NEXUS_EXTERNAL_PASSWORD }}
        run: python3 -I scripts/connector-distribution/publish_connectors.py finalize --source source --plan release_plan.json

      - name: Clean local release files
        if: always()
        shell: bash
        run: rm -rf -- build-requests build-output release_plan.json
