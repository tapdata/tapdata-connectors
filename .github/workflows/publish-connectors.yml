name: Publish connector artifacts

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Connector branch or tag to publish (defaults to the selected workflow ref)
        required: false
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: Connector branch or tag to publish.
        required: false
        type: string
    secrets:
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: connector-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout connector sources and history
        uses: actions/checkout@v4
        with:
          repository: tapdata/tapdata-connectors
          ref: ${{ inputs.source_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Java and Nexus Maven credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: tapdata-releases
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Detect changed connectors, publish releases and generate BOM
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: python3 connector-distribution/publish_connectors.py
